name: Build and Publish Resource Packon:  push:    branches:      - main  workflow_dispatch:permissions:  contents: writeconcurrency:  group: cravemc-resource-pack  cancel-in-progress: truejobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Build resource pack ZIP        run: |          rm -f cravemc-events.zip          zip -r cravemc-events.zip \            assets \            shaders \            overlay_1_20_2 \            overlay_1_21_4 \            overlay_26 \            overlay_26_2 \            pack.mcmeta \            pack.png      - name: Verify resource pack        run: |          unzip -l cravemc-events.zip          if ! unzip -l cravemc-events.zip | grep -q "pack.mcmeta"; then            echo "pack.mcmeta is missing from ZIP root"            exit 1          fi      - name: Generate SHA1        run: |          sha1sum cravemc-events.zip | awk '{print $1}' > cravemc-events.sha1          echo "Resource Pack SHA1:"          cat cravemc-events.sha1      - name: Create or update latest release        env:          GH_TOKEN: ${{ github.token }}        run: |          if gh release view latest >/dev/null 2>&1; then            gh release upload latest \              cravemc-events.zip \              cravemc-events.sha1 \              --clobber          else            gh release create latest \              cravemc-events.zip \              cravemc-events.sha1 \              --title "Latest CraveMC Events Resource Pack" \              --notes "Automatically built from the latest main branch."          fi