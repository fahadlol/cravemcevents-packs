name: Build and Publish Resource Pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cravemc-resource-pack
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build resource pack ZIP
        run: |
          rm -f cravemc-events.zip
          zip -r cravemc-events.zip \
            assets \
            shaders \
            overlay_1_20_2 \
            overlay_1_21_4 \
            overlay_1_21_11 \
            overlay_26 \
            overlay_26_2 \
            overlay_26_3 \
            pack.mcmeta \
            pack.png

      - name: Verify resource pack
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/audit_resource_pack.py . --zip cravemc-events.zip
          unzip -l cravemc-events.zip
          if ! unzip -l cravemc-events.zip | grep -q "pack.mcmeta"; then
            echo "pack.mcmeta is missing from ZIP root"
            exit 1
          fi
          if ! unzip -l cravemc-events.zip | grep -q "overlay_26_3/assets/minecraft/shaders/core/particle.vsh"; then
            echo "26.3 particle HUD shader is missing"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("pack.mcmeta").read_text(encoding="utf-8"))
          pack = metadata["pack"]
          assert pack["pack_format"] == 75
          assert pack["min_format"] == 75
          assert pack["max_format"] == [97, 1]
          assert "supported_formats" not in pack
          overlay = next(
              entry for entry in metadata["overlays"]["entries"]
              if entry["directory"] == "overlay_26_2"
          )
          assert overlay["formats"] == {
              "min_inclusive": [88, 0],
              "max_inclusive": [88, 0],
          }
          print("Minecraft 26.2 metadata verified at resource-pack format 88.0")
          PY

      - name: Generate SHA1
        run: |
          sha1sum cravemc-events.zip | awk '{print $1}' > cravemc-events.sha1
          echo "Resource Pack SHA1:"
          cat cravemc-events.sha1

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              cravemc-events.zip \
              cravemc-events.sha1 \
              --clobber
          else
            gh release create latest \
              cravemc-events.zip \
              cravemc-events.sha1 \
              --title "Latest CraveMC Events Resource Pack" \
              --notes "Automatically built from the latest main branch."
          fi
