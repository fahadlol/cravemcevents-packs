name: Build and Publish Resource Pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cravemc-resource-pack
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build resource pack ZIP
        run: python3 tools/build_resource_pack.py . cravemc-events.zip

      - name: Verify resource pack
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/audit_resource_pack.py . --zip cravemc-events.zip
          unzip -l cravemc-events.zip
          if ! unzip -l cravemc-events.zip | grep -q "pack.mcmeta"; then
            echo "pack.mcmeta is missing from ZIP root"
            exit 1
          fi
          if ! unzip -l cravemc-events.zip | grep -q "overlay_26_3/assets/minecraft/shaders/core/particle.vsh"; then
            echo "26.3 particle HUD shader is missing"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("pack.mcmeta").read_text(encoding="utf-8"))
          pack = metadata["pack"]
          assert pack["pack_format"] == 75
          assert pack["min_format"] == 75
          assert pack["max_format"] == [97, 1]
          assert "supported_formats" not in pack
          expected = {
              "overlay_1_21_11": (75, 83),
              "overlay_26": (84, 87),
              "overlay_26_2": ([88, 0], [88, 0]),
              "overlay_26_3": (97, [97, 1]),
          }
          entries = {entry["directory"]: entry for entry in metadata["overlays"]["entries"]}
          for directory, (minimum, maximum) in expected.items():
              overlay = entries[directory]
              assert "formats" not in overlay
              assert overlay["min_format"] == minimum
              assert overlay["max_format"] == maximum
          print("Minecraft 1.21.11 and 26.1-26.3 metadata ranges verified")
          PY

      - name: Generate SHA1
        run: |
          sha1sum cravemc-events.zip | awk '{print $1}' > cravemc-events.sha1
          echo "Resource Pack SHA1:"
          cat cravemc-events.sha1

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              cravemc-events.zip \
              cravemc-events.sha1 \
              --clobber
          else
            gh release create latest \
              cravemc-events.zip \
              cravemc-events.sha1 \
              --title "Latest CraveMC Events Resource Pack" \
              --notes "Automatically built from the latest main branch."
          fi
